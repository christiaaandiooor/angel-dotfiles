# hypridle — con batería: atenúa a los 4 min, bloquea y suspende a los 5 min.
# Conectada a la corriente: no hace nada (nunca se apaga).
# Backup del original: hypridle.conf.bak-power

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 4 min: bajar brillo (solo en batería)
listener {
    timeout = 240
    on-timeout = ~/.config/hypr/scripts/on-battery.sh 'brightnessctl -s set 10 && touch /tmp/angel-dimmed; brightnessctl -sd rgb:kbd_backlight set 0'
    on-resume = [ -e /tmp/angel-dimmed ] && { rm -f /tmp/angel-dimmed; brightnessctl -r; brightnessctl -rd rgb:kbd_backlight; }
}

# 5 min: suspender (solo en batería; before_sleep_cmd bloquea la pantalla)
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/on-battery.sh 'systemctl suspend'
}

# 3 min conectada a la corriente: protector de pantalla angel (se quita al mover el mouse)
listener {
    timeout = 180
    on-timeout = ~/.config/hypr/scripts/on-ac.sh '~/.config/hypr/scripts/screensaver.sh start'
    on-resume = ~/.config/hypr/scripts/screensaver.sh stop
}
