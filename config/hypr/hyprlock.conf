# 🎀 hyprlock · angel theme
$font  = JetBrainsMono Nerd Font
$text  = rgb(5b3b6e)
$pink  = rgb(ff8fc8)
$lav   = rgb(c3a6f5)
$blue  = rgb(8fcff7)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = overshot, 0.34, 1.56, 0.64, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 3, overshot
    animation = inputFieldColors, 1, 4, linear
}

background {
    monitor =
    path = ~/Pictures/wallpapers/bloqueo.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.95
    vibrancy = 0.25
}

# tarjetita translúcida detrás de todo
shape {
    monitor =
    size = 460, 440
    color = rgba(255, 245, 251, 0.72)
    rounding = 32
    border_size = 3
    border_color = $pink $lav $blue 45deg
    position = 0, 10
    halign = center
    valign = center
}

# HORA
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 84
    font_family = $font ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

# FECHA
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/fecha.sh
    color = rgb(9b7fd6)
    font_size = 16
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

# saludito
label {
    monitor =
    text = Hola de nuevo, __NAME__  (◕‿◕✿)
    color = rgb(e25da4)
    font_size = 13
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 3
    rounding = 27
    inner_color = rgba(255, 255, 255, 0.85)
    outer_color = $pink $lav 45deg
    check_color = $blue $lav 120deg
    fail_color  = rgb(ff5fae) rgb(e0457b) 40deg
    capslock_color = rgb(e8b04a)
    font_color  = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>Contraseña ✧</i>
    fail_text = <b>Uy, no era (；ω；)</b>
    dots_text_format = ♥
    dots_size = 0.45
    dots_spacing = 0.25
    dots_center = true
    position = 0, -80
    halign = center
    valign = center
}

# distribución de teclado
label {
    monitor =
    text = 󰌌  $LAYOUT[US,LA]
    color = rgb(a98bbb)
    font_size = 11
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -150
    halign = center
    valign = center
}

# avatar arriba de la tarjeta
image {
    monitor =
    path = ~/.config/fastfetch/logos/k-angel.png
    size = 110
    rounding = -1
    border_size = 4
    border_color = $pink $lav 45deg
    position = 0, 280
    halign = center
    valign = center
}

# batería (arriba a la derecha)
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh battery
    color = $text
    font_size = 14
    font_family = $font Bold
    position = -40, -30
    halign = right
    valign = top
}

# música que está sonando (abajo)
shape {
    monitor =
    size = 520, 52
    color = rgba(255, 245, 251, 0.6)
    rounding = 26
    border_size = 2
    border_color = $pink $lav 45deg
    position = 0, 70
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-info.sh music
    color = $text
    font_size = 12
    font_family = $font
    position = 0, 86
    halign = center
    valign = bottom
}

# frase del día
label {
    monitor =
    text = cmd[update:3600000] ~/.config/hypr/scripts/lock-info.sh frase
    color = rgb(e25da4)
    font_size = 12
    font_family = $font Italic
    position = 0, 30
    halign = center
    valign = bottom
}
